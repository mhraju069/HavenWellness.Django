  /api/dashboards/admin/payments/:
    get:
      operationId: dashboards_admin_payments_retrieve
      description: Returns this month's total revenue, service-wise breakdown (Sauna,
        Saltroom, Activity, Package), and searchable/filterable list of booking payments.
      summary: Admin Payments overview, monthly breakdown, and booking payments list
      parameters:
      - in: query
        name: booking_id
        schema:
          type: string
        description: Direct filter by booking ID
      - in: query
        name: client_name
        schema:
          type: string
        description: Direct filter by client name
      - in: query
        name: date
        schema:
          type: string
        description: Exact booking or payment date (YYYY-MM-DD or 'today')
      - in: query
        name: email
        schema:
          type: string
        description: Direct filter by client email
      - in: query
        name: end_date
        schema:
          type: string
        description: Filter booking/payment dates up to this date (YYYY-MM-DD)
      - in: query
        name: month
        schema:
          type: integer
        description: 'Target month for metrics (1-12, default: current month)'
      - in: query
        name: ordering
        schema:
          type: string
        description: 'Sorting: -created_at (default), created_at, -amount, amount,
          -date, date'
      - in: query
        name: page
        schema:
          type: integer
        description: 'Page number (default: 1)'
      - in: query
        name: page_size
        schema:
          type: integer
        description: 'Number of results per page (default: 10, max: 100)'
      - in: query
        name: payment_status
        schema:
          type: string
        description: 'Filter by payment status: paid, paid_with_package, pending,
          all'
      - in: query
        name: search
        schema:
          type: string
        description: Search keyword across Booking ID, Client Name, Email, and Phone
      - in: query
        name: service_type
        schema:
          type: string
        description: 'Filter payments by service: sauna, private_sauna, shared_sauna,
          saltroom, activity, package, all'
      - in: query
        name: start_date
        schema:
          type: string
        description: Filter booking/payment dates starting from this date (YYYY-MM-DD)
      - in: query
        name: year
        schema:
          type: integer
        description: 'Target year for metrics (default: current year)'
      tags:
      - Admin Payments
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminPaymentsResponse'
          description: ''
