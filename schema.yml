          type: string
        description: Filter users joined on exact date (YYYY-MM-DD or 'today')
      - in: query
        name: end_date
        schema:
          type: string
        description: Filter users joined on or before date (YYYY-MM-DD)
      - in: query
        name: id
        schema:
          type: integer
        description: Direct lookup by User ID
      - in: query
        name: is_active
        schema:
          type: string
        description: 'Filter by active status: ''true'', ''false'', ''1'', ''0'''
      - in: query
        name: language
        schema:
          type: string
        description: 'Filter by language code: ''en'', ''nl'', ''de'''
      - in: query
        name: ordering
        schema:
          type: string
        description: 'Order by field: ''-date_joined'' (default), ''date_joined'',
          ''name'', ''-name'', ''email'', ''-email'''
      - in: query
        name: page
        schema:
          type: integer
        description: 'Page number (default: 1)'
      - in: query
        name: page_size
        schema:
          type: integer
        description: 'Number of results per page (default: 10, max: 100)'
