      - {}
      responses:
        '200':
          description: No response body
  /api/bookings/{booking_id}/cancel/:
    post:
      operationId: bookings_cancel_create_2
      description: Cancels any booking (Sauna, Saltroom, Activity, Lunchroom, Package,
        Event) if requested more than 24 hours before the scheduled appointment start
        time. If cancellation occurs within 24 hours of start time (or after start
        time), cancellation is rejected. For bookings booked with a Session Pass /
        Membership, the deducted credit is automatically restored.
      summary: Cancel a booking (Enforces 24-hour notice & restores pass session credits)
      parameters:
      - in: path
        name: booking_id
        schema:
          type: string
        required: true
      tags:
      - Bookings
      requestBody:
        content:
          application/json:
