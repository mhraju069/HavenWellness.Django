        name: page
        schema:
          type: integer
        description: 'Page number (default: 1)'
      - in: query
        name: page_size
        schema:
          type: integer
        description: 'Results per page (default: 20)'
      - in: query
        name: search
        schema:
          type: string
        description: Search across name, email, phone, subject, or message
      tags:
      - Support Messages
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
