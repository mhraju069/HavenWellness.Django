openapi: 3.0.3
info:
  title: Haven Wellness API
  version: 1.0.0
  description: Comprehensive REST API documentation for Haven Wellness services, bookings,
    user accounts, dashboards, payments, and notifications.
paths:
  /api/auth/get-otp/:
    post:
      operationId: auth_get_otp_create
      summary: Request OTP email verification code
      tags:
      - Accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetOtpRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/GetOtpRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/GetOtpRequestRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetOtpResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetOtpResponse'
          description: ''
  /api/auth/login/:
    post:
      operationId: auth_login_create
      summary: Login user with email and password
      tags:
      - Accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
          description: ''
  /api/auth/register/:
    post:
      operationId: auth_register_create
      summary: Register a new user
      tags:
      - Accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
          description: ''
  /api/auth/token/refresh/:
    post:
      operationId: auth_token_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/auth/user/:
    get:
      operationId: auth_user_retrieve
      summary: Retrieve, update or delete the authenticated user profile
      tags:
      - Accounts
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
          description: ''
    put:
      operationId: auth_user_update
      summary: Retrieve, update or delete the authenticated user profile
      tags:
      - Accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserProfileRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserProfileRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserProfileRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
          description: ''
    patch:
      operationId: auth_user_partial_update
      summary: Retrieve, update or delete the authenticated user profile
      tags:
      - Accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUserProfileRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUserProfileRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUserProfileRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
          description: ''
    delete:
      operationId: auth_user_destroy
      summary: Retrieve, update or delete the authenticated user profile
      tags:
      - Accounts
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
          description: ''
  /api/auth/verify-otp/:
    post:
      operationId: auth_verify_otp_create
      summary: Verify OTP code and receive JWT tokens
      tags:
      - Accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpVerifyRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OtpVerifyRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OtpVerifyRequestRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpVerifyResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetOtpResponse'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetOtpResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetOtpResponse'
          description: ''
  /api/bookings/sauna/:
    get:
      operationId: bookings_sauna_list
      summary: Create or List Sauna Bookings (Shared & Private)
      parameters:
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      tags:
      - Bookings
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedSaunaBookingList'
          description: ''
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedSaunaBookingList'
          description: ''
    post:
      operationId: bookings_sauna_create
      summary: Create or List Sauna Bookings (Shared & Private)
      parameters:
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      tags:
      - Bookings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaunaBookingRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SaunaBookingRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SaunaBookingRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedSaunaBookingList'
          description: ''
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaunaBooking'
          description: ''
  /api/bookings/sauna/confirm/:
    get:
      operationId: bookings_sauna_confirm_list
      summary: Create or List Sauna Bookings (Shared & Private)
      parameters:
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      tags:
      - Bookings
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedSaunaBookingList'
          description: ''
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedSaunaBookingList'
          description: ''
    post:
      operationId: bookings_sauna_confirm_create
      summary: Create or List Sauna Bookings (Shared & Private)
      parameters:
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      tags:
      - Bookings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaunaBookingRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SaunaBookingRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SaunaBookingRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedSaunaBookingList'
          description: ''
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaunaBooking'
          description: ''
  /api/notify/:
    get:
      operationId: notify_retrieve
      summary: Get user notifications list
      tags:
      - Notifications
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationListResponse'
          description: ''
  /api/notify/register-device/:
    post:
      operationId: notify_register_device_create
      summary: Register device token for push notifications
      parameters:
      - in: query
        name: token
        schema:
          type: string
        description: FCM Device token
        required: true
      tags:
      - Notifications
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DeviceRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DeviceRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceRegisterResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/payments/cancel/:
    get:
      operationId: payments_cancel_retrieve
      summary: Payment cancel callback page
      tags:
      - Payments
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentMessageResponse'
          description: ''
  /api/payments/create-checkout-session/:
    post:
      operationId: payments_create_checkout_session_create
      summary: Create Stripe Checkout Session for a Booking
      tags:
      - Payments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCheckoutSessionRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CreateCheckoutSessionRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateCheckoutSessionRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateCheckoutSessionResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '404':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/payments/success/:
    get:
      operationId: payments_success_retrieve
      summary: Payment success callback page
      tags:
      - Payments
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentMessageResponse'
          description: ''
  /api/payments/webhook/:
    post:
      operationId: payments_webhook_create
      summary: Stripe Webhook Handler
      tags:
      - Payments
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: {}
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: {}
          multipart/form-data:
            schema:
              type: object
              additionalProperties: {}
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: string
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: string
          description: ''
  /api/services/:
    get:
      operationId: services_list
      summary: List all Services
      parameters:
      - in: query
        name: type
        schema:
          type: string
        description: Filter by service type (sauna, activity, saltroom, package, event,
          lunchroom)
      tags:
      - Services
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Services'
          description: ''
  /api/services/details/:
    get:
      operationId: services_details_retrieve
      summary: Get Service Details by Type
      parameters:
      - in: query
        name: type
        schema:
          type: string
        description: 'Service type: ''sauna'', ''activity'', ''saltroom'', ''package'',
          ''lunchroom'', ''event'''
      tags:
      - Services
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/services/details/{service_type}/:
    get:
      operationId: services_details_retrieve_2
      summary: Get Service Details by Type
      parameters:
      - in: path
        name: service_type
        schema:
          type: string
        required: true
      - in: query
        name: type
        schema:
          type: string
        description: 'Service type: ''sauna'', ''activity'', ''saltroom'', ''package'',
          ''lunchroom'', ''event'''
      tags:
      - Services
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/services/slots/:
    get:
      operationId: services_slots_retrieve
      summary: Get available slots for a service (sauna, saltroom, activity, lunchroom,
        event)
      parameters:
      - in: query
        name: date
        schema:
          type: string
        description: Date (YYYY-MM-DD)
        required: true
      - in: query
        name: type
        schema:
          type: string
        description: Service Type (e.g. sauna, private_sauna, shared_sauna)
      tags:
      - Services
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/services/slots/{service_type}/:
    get:
      operationId: services_slots_retrieve_2
      summary: Get available slots for a service (sauna, saltroom, activity, lunchroom,
        event)
      parameters:
      - in: query
        name: date
        schema:
          type: string
        description: Date (YYYY-MM-DD)
        required: true
      - in: path
        name: service_type
        schema:
          type: string
        required: true
      - in: query
        name: type
        schema:
          type: string
        description: Service Type (e.g. sauna, private_sauna, shared_sauna)
      tags:
      - Services
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/token/:
    post:
      operationId: token_create
      description: |-
        Takes a set of user credentials and returns an access and refresh JSON web
        token pair to prove the authentication of those credentials.
      tags:
      - token
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenObtainPairRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenObtainPairRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenObtainPairRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenObtainPair'
          description: ''
  /api/token/refresh/:
    post:
      operationId: token_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - token
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
components:
  schemas:
    AuthResponse:
      type: object
      properties:
        status:
          type: boolean
        log:
          type: string
        access:
          type: string
          description: JWT Access Token
        refresh:
          type: string
          description: JWT Refresh Token
        user:
          $ref: '#/components/schemas/UserProfile'
      required:
      - log
      - status
    CreateCheckoutSessionRequest:
      type: object
      properties:
        booking_id:
          type: string
          minLength: 1
          description: Booking ID, e.g. SS-0001 or PS-0001 or numeric ID
          maxLength: 100
        service_type:
          type: string
          minLength: 1
          default: sauna
          description: Type of service (e.g. sauna, saltroom)
          maxLength: 50
        success_url:
          type: string
          format: uri
          minLength: 1
          description: Redirect URL after successful payment
        cancel_url:
          type: string
          format: uri
          minLength: 1
          description: Redirect URL after cancelled payment
      required:
      - booking_id
    CreateCheckoutSessionResponse:
      type: object
      properties:
        status:
          type: boolean
          default: true
        checkout_url:
          type: string
          format: uri
        session_id:
          type: string
        booking_id:
          type: string
        payment_id:
          type: integer
      required:
      - booking_id
      - checkout_url
      - payment_id
      - session_id
    DeviceRegisterResponse:
      type: object
      properties:
        message:
          type: string
      required:
      - message
    DeviceRequest:
      type: object
      properties:
        token:
          type: string
          minLength: 1
      required:
      - token
    GetOtpRequestRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
          description: User's email address to send OTP
        task:
          type: string
          default: ''
          description: Optional task label
      required:
      - email
    GetOtpResponse:
      type: object
      properties:
        status:
          type: boolean
        log:
          type: string
      required:
      - log
      - status
    LanguageEnum:
      enum:
      - en
      - de
      - nl
      type: string
      description: |-
        * `en` - English
        * `de` - German
        * `nl` - Dutch
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
          description: User's email address
        password:
          type: string
          writeOnly: true
          minLength: 1
          description: User's password
      required:
      - email
      - password
    Notification:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 255
        body:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        user:
          type: integer
          readOnly: true
      required:
      - body
      - created_at
      - id
      - title
      - updated_at
      - user
    NotificationListResponse:
      type: object
      properties:
        notifications:
          type: array
          items:
            $ref: '#/components/schemas/Notification'
      required:
      - notifications
    OtpVerifyRequestRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
          description: User's email address
        otp_code:
          type: string
          minLength: 1
          description: 6-digit OTP code
          maxLength: 6
      required:
      - email
      - otp_code
    OtpVerifyResponse:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/UserProfile'
        refresh:
          type: string
          description: JWT Refresh Token
        access:
          type: string
          description: JWT Access Token
      required:
      - access
      - refresh
      - user
    PaginatedSaunaBookingList:
      type: object
      required:
      - results
      properties:
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?cursor=cD00ODY%3D"
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?cursor=cj0xJnA9NDg3
        results:
          type: array
          items:
            $ref: '#/components/schemas/SaunaBooking'
    PatchedUserProfileRequest:
      type: object
      properties:
        name:
          type: string
          nullable: true
          title: User Name
          maxLength: 200
        bio:
          type: string
          nullable: true
          title: User Bio
        image:
          type: string
          format: binary
          nullable: true
        phone:
          type: string
          nullable: true
          maxLength: 15
        language:
          $ref: '#/components/schemas/LanguageEnum'
        old_password:
          type: string
          writeOnly: true
          minLength: 1
          description: Current password required when updating password
        password:
          type: string
          writeOnly: true
          minLength: 1
          description: New password
    PaymentMessageResponse:
      type: object
      properties:
        message:
          type: string
      required:
      - message
    PaymentStatusEnum:
      enum:
      - pending
      - paid
      type: string
      description: |-
        * `pending` - Pending
        * `paid` - Paid
    RegisterRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
          description: User's email address
        password:
          type: string
          writeOnly: true
          minLength: 6
          description: User's password
        name:
          type: string
          description: User's full name
      required:
      - email
      - password
    RoleEnum:
      enum:
      - user
      - admin
      type: string
      description: |-
        * `user` - User
        * `admin` - Admin
    SaunaBooking:
      type: object
      properties:
        id:
          type: integer
