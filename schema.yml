openapi: 3.0.3
info:
  title: Haven Wellness API
  version: 1.0.0
  description: Comprehensive REST API documentation for Haven Wellness services, bookings,
    user accounts, dashboards, payments, and notifications.
paths:
  /api/auth/:
    post:
      operationId: auth_create
      summary: Authenticate or register user via Firebase ID Token
      parameters:
      - in: query
        name: oauth
        schema:
          type: boolean
          default: true
        description: Whether login is via OAuth provider
      - in: query
        name: token
        schema:
          type: string
        description: Firebase ID Token
        required: true
      tags:
      - Accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FirebaseLoginRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/FirebaseLoginRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FirebaseLoginRequestRequest'
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FirebaseLoginResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetOtpResponse'
          description: ''
  /api/auth/get-otp/:
    post:
      operationId: auth_get_otp_create
      summary: Request OTP email verification code
      tags:
      - Accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetOtpRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/GetOtpRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/GetOtpRequestRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetOtpResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetOtpResponse'
          description: ''
  /api/auth/token/refresh/:
    post:
      operationId: auth_token_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/auth/user/:
    get:
      operationId: auth_user_retrieve
      summary: Retrieve, update or delete the authenticated user profile
      tags:
      - Accounts
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
          description: ''
    put:
      operationId: auth_user_update
      summary: Retrieve, update or delete the authenticated user profile
      tags:
      - Accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserProfileRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserProfileRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserProfileRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
          description: ''
    patch:
      operationId: auth_user_partial_update
      summary: Retrieve, update or delete the authenticated user profile
      tags:
      - Accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUserProfileRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUserProfileRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUserProfileRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
          description: ''
    delete:
      operationId: auth_user_destroy
      summary: Retrieve, update or delete the authenticated user profile
      tags:
      - Accounts
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
          description: ''
  /api/auth/verify-otp/:
    post:
      operationId: auth_verify_otp_create
      summary: Verify OTP code and receive JWT tokens
      tags:
      - Accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpVerifyRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OtpVerifyRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OtpVerifyRequestRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpVerifyResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetOtpResponse'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetOtpResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetOtpResponse'
          description: ''
  /api/bookings/:
    get:
      operationId: bookings_list
      summary: List or create bookings for the authenticated user
      parameters:
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      tags:
      - Bookings
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBookingList'
          description: ''
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBookingList'
          description: ''
    post:
      operationId: bookings_create
      summary: List or create bookings for the authenticated user
      parameters:
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      tags:
      - Bookings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BookingRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BookingRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBookingList'
          description: ''
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
          description: ''
  /api/bookings/slots/:
    get:
      operationId: bookings_slots_list
      summary: Get available time slots for a given date and service
      parameters:
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - in: query
        name: date
        schema:
          type: string
          format: date
        description: Booking date (YYYY-MM-DD)
        required: true
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - in: query
        name: service
        schema:
          type: string
        description: Service title (e.g. private_sauna)
        required: true
      tags:
      - Bookings
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTimeSlotList'
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/dashboard/:
    get:
      operationId: dashboard_retrieve
      summary: Get admin dashboard overview metrics and today's bookings
      tags:
      - Dashboard
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardSummaryResponse'
          description: ''
  /api/dashboard/access-codes/:
    get:
      operationId: dashboard_access_codes_list
      summary: List active access codes for sauna services
      parameters:
      - in: query
        name: booking__service
        schema:
          type: string
          enum:
          - activity
          - arrangement
          - lunchroom
          - private_sauna
          - shared_sauna
        description: |-
          * `private_sauna` - Private Sauna
          * `shared_sauna` - Shared Sauna
          * `arrangement` - Arrangement
          * `activity` - Activity
          * `lunchroom` - Lunchroom
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - in: query
        name: is_active
        schema:
          type: boolean
      - in: query
        name: is_used
        schema:
          type: boolean
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      tags:
      - Dashboard
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAccessCodeList'
          description: ''
  /api/dashboard/capacity/:
    get:
      operationId: dashboard_capacity_retrieve
      summary: Get capacity status breakdown per service
      tags:
      - Dashboard
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapacityListResponse'
          description: ''
  /api/dashboard/exclude-dates/:
    get:
      operationId: dashboard_exclude_dates_list
      summary: List or create excluded date entries for services
      parameters:
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      tags:
      - Dashboard
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDashboardExcludeDateList'
          description: ''
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDashboardExcludeDateList'
          description: ''
    post:
      operationId: dashboard_exclude_dates_create
      summary: List or create excluded date entries for services
      parameters:
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      tags:
      - Dashboard
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DashboardExcludeDateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DashboardExcludeDateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DashboardExcludeDateRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDashboardExcludeDateList'
          description: ''
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardExcludeDate'
          description: ''
  /api/dashboard/exclude-dates/{id}/:
    get:
      operationId: dashboard_exclude_dates_retrieve
      summary: Retrieve, update or delete an excluded date entry
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Dashboard
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardExcludeDate'
          description: ''
    put:
      operationId: dashboard_exclude_dates_update
      summary: Retrieve, update or delete an excluded date entry
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Dashboard
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DashboardExcludeDateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DashboardExcludeDateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DashboardExcludeDateRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardExcludeDate'
          description: ''
    patch:
      operationId: dashboard_exclude_dates_partial_update
      summary: Retrieve, update or delete an excluded date entry
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Dashboard
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedDashboardExcludeDateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedDashboardExcludeDateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedDashboardExcludeDateRequest'
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardExcludeDate'
          description: ''
    delete:
      operationId: dashboard_exclude_dates_destroy
      summary: Retrieve, update or delete an excluded date entry
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Dashboard
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardExcludeDate'
          description: ''
  /api/dashboard/payments/:
    get:
      operationId: dashboard_payments_list
      summary: List all completed/paid payment records
      tags:
      - Dashboard
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Payment'
          description: ''
  /api/dashboard/reservations/:
    get:
      operationId: dashboard_reservations_list
      summary: List all reservations with filtering and ordering
      parameters:
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - in: query
        name: payment_status
        schema:
          type: string
          enum:
          - on_site
          - paid
          - pending
        description: |-
          * `pending` - Pending
          * `paid` - Paid
          * `on_site` - On Site
      - in: query
        name: service
        schema:
          type: string
          enum:
          - activity
          - arrangement
          - lunchroom
          - private_sauna
          - shared_sauna
        description: |-
          * `private_sauna` - Private Sauna
          * `shared_sauna` - Shared Sauna
          * `arrangement` - Arrangement
          * `activity` - Activity
          * `lunchroom` - Lunchroom
      - in: query
        name: status
        schema:
          type: string
          enum:
          - cancelled
          - confirmed
        description: |-
          * `confirmed` - Confirmed
          * `cancelled` - Cancelled
      - in: query
        name: time_slot__date
        schema:
          type: string
          format: date
      tags:
      - Dashboard
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBookingList'
          description: ''
  /api/dashboard/services/:
    get:
      operationId: dashboard_services_retrieve
      summary: Get service statistics and aggregated details
      tags:
      - Dashboard
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceStatsResponse'
          description: ''
  /api/notify/:
    get:
      operationId: notify_retrieve
      summary: Get user notifications list
      tags:
      - Notifications
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationListResponse'
          description: ''
  /api/notify/register-device/:
    post:
      operationId: notify_register_device_create
      summary: Register device token for push notifications
      parameters:
      - in: query
        name: token
        schema:
          type: string
        description: FCM Device token
        required: true
      tags:
      - Notifications
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DeviceRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DeviceRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceRegisterResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/payments/cancel/:
    get:
      operationId: payments_cancel_retrieve
      summary: Payment cancel callback page
      tags:
      - Payments
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentMessageResponse'
          description: ''
  /api/payments/get-link/:
    post:
      operationId: payments_get_link_create
      summary: Generate Stripe checkout payment link or payment intent for a booking
      parameters:
      - in: query
        name: method
        schema:
          type: string
          default: web
        description: Payment flow method ('web' or 'app')
      tags:
      - Payments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetPaymentLinkRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/GetPaymentLinkRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/GetPaymentLinkRequestRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetPaymentLinkResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '404':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/payments/success/:
    get:
      operationId: payments_success_retrieve
      summary: Payment success callback page
      tags:
      - Payments
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentMessageResponse'
          description: ''
  /api/payments/webhook/:
    post:
      operationId: payments_webhook_create
      summary: Stripe Webhook handler
      tags:
      - Payments
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: {}
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: {}
          multipart/form-data:
            schema:
              type: object
              additionalProperties: {}
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: string
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: string
          description: ''
  /api/services/:
    get:
      operationId: services_list
      summary: List all active services or create a new service
      parameters:
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - in: query
        name: title
        schema:
          type: string
          enum:
          - activity
          - arrangement
          - lunchroom
          - private_sauna
          - shared_sauna
        description: |-
          * `private_sauna` - Private Sauna
          * `shared_sauna` - Shared Sauna
          * `arrangement` - Arrangement
          * `activity` - Activity
          * `lunchroom` - Lunchroom
      tags:
      - Services
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedServiceList'
          description: ''
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedServiceList'
          description: ''
    post:
      operationId: services_create
      summary: List all active services or create a new service
      parameters:
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - in: query
        name: title
        schema:
          type: string
          enum:
          - activity
          - arrangement
          - lunchroom
          - private_sauna
          - shared_sauna
        description: |-
          * `private_sauna` - Private Sauna
          * `shared_sauna` - Shared Sauna
          * `arrangement` - Arrangement
          * `activity` - Activity
          * `lunchroom` - Lunchroom
      tags:
      - Services
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ServiceRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ServiceRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedServiceList'
          description: ''
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Service'
          description: ''
  /api/services/exclude-date/:
    get:
      operationId: services_exclude_date_list
      summary: List or create excluded dates for services
      parameters:
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - in: query
        name: service
        schema:
          type: array
          items:
            type: string
            enum:
            - activity
            - arrangement
            - lunchroom
            - private_sauna
            - shared_sauna
        description: |-
          * `private_sauna` - Private Sauna
          * `shared_sauna` - Shared Sauna
