components:
  schemas:
    AccessCodeItem:
      type: object
      properties:
        booking_id:
          type: string
        access_code:
          type: string
        sauna_type:
          type: string
        date:
          type: string
        time:
          type: string
        time_slot:
          type: string
        status:
          type: string
        payment_status:
          type: string
        guests:
          type: integer
          default: 1
        details:
          type: object
          additionalProperties: {}
      required:
      - access_code
      - booking_id
      - date
      - payment_status
      - sauna_type
      - status
      - time
      - time_slot
    AccessCodeSection:
      type: object
      properties:
        private_sauna:
          type: array
          items:
            $ref: '#/components/schemas/AccessCodeItem'
        shared_sauna:
          type: array
          items:
            $ref: '#/components/schemas/AccessCodeItem'
        all_sauna:
          type: array
          items:
            $ref: '#/components/schemas/AccessCodeItem'
      required:
      - all_sauna
      - private_sauna
      - shared_sauna
    ActivityBooking:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          description: Guest Name (Required)
        email:
          type: string
          format: email
          description: Guest Email (Required)
        phone:
          type: string
          description: Guest Phone Number (Required)
        special_request:
          type: string
          nullable: true
          description: Special Request or Comment (Optional)
        booking_id:
          type: string
          readOnly: true
        capacity:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          description: Capacity / guest count
        status:
          $ref: '#/components/schemas/Status086Enum'
        payment_status:
          $ref: '#/components/schemas/PaymentStatusB1eEnum'
        total_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        user:
          type: integer
          readOnly: true
          nullable: true
        activity:
          type: integer
      required:
      - activity
      - booking_id
      - created_at
      - email
      - id
      - name
      - phone
      - updated_at
      - user
    ActivityBookingRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          description: Guest Name (Required)
        email:
          type: string
          format: email
          minLength: 1
          description: Guest Email (Required)
        phone:
          type: string
          minLength: 1
          description: Guest Phone Number (Required)
        special_request:
          type: string
          nullable: true
          description: Special Request or Comment (Optional)
        capacity:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          description: Capacity / guest count
        status:
          $ref: '#/components/schemas/Status086Enum'
        payment_status:
          $ref: '#/components/schemas/PaymentStatusB1eEnum'
        total_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        activity:
          type: integer
      required:
      - activity
      - email
      - name
      - phone
    AdminAccessCodeItem:
      type: object
      properties:
        id:
          type: integer
        booking_id:
          type: string
          description: Unique booking ID reference, e.g. PS-0070, SS-0001
        access_code:
          type: string
          description: Access code for entry/gate/sauna, e.g. PS-0070
        sauna_type:
          type: string
          description: 'Type of sauna: ''private'' or ''shared'''
        service_name:
          type: string
          description: 'Display title: ''Private Sauna'' or ''Shared Sauna'''
        client_name:
          type: string
          nullable: true
          description: Full client name
        client_email:
          type: string
          nullable: true
          description: Client email address
        client_phone:
          type: string
          nullable: true
          description: Client phone number
        user_id:
          type: integer
          nullable: true
          description: Linked user ID
        date:
          type: string
          description: Sauna booking date (YYYY-MM-DD)
        time:
          type: string
          description: Sauna booking start time (HH:MM)
        time_slot:
          type: string
          description: Time slot length, e.g. '3_hours', '4_hours', '90_mins'
        guests:
          type: integer
          default: 1
          description: Capacity / number of persons
        status:
          type: string
          description: 'Booking status: pending, confirmed, cancelled'
        payment_status:
          type: string
          description: 'Payment status: pending, paid, paid_with_package'
        total_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          default: '0.00'
          description: Total price charged
        special_request:
          type: string
          nullable: true
          description: Special requests
        selected_features:
          type: array
          items:
            type: string
          description: List of selected features/add-ons
        created_at:
          type: string
          format: date-time
          nullable: true
          description: Booking creation timestamp
        details:
          type: object
          additionalProperties: {}
          description: Detailed booking attributes
      required:
      - access_code
      - booking_id
      - date
      - payment_status
      - sauna_type
      - service_name
      - status
      - time
      - time_slot
