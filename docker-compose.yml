services:
  backend:
    build: .
    container_name: backend
    command: >
      sh -c "python manage.py collectstatic --noinput && python manage.py makemigrations && python manage.py migrate && gunicorn core.asgi:application -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:8000 --workers 4"
    volumes:
      - .:/app
    expose:
      - "8000"
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=core.settings
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DB_HOST=db
    depends_on:
      - redis
      - db
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: db
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_NAME:-haven_wellness}
      POSTGRES_USER: ${DB_USER:-maggy}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-maggy@321}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  nginx:
    image: nginx:stable
    container_name: nginx
    ports:
      - "8000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ./staticfiles:/app/staticfiles
      - ./media:/app/media
      # - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - web
    restart: always

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: always
    ports:
      - "6379:6379"

  celery_worker:
    build: .
    container_name: celery_worker
    command: celery -A core worker -l info --pool=solo
    volumes:
      - .:/app
    working_dir: /app
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=core.settings
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DB_HOST=db
    depends_on:
      - redis
      - db
      - web
    restart: always

  celery_beat:
    build: .
    container_name: celery_beat
    command: celery -A core beat -l info
    volumes:
      - .:/app
    working_dir: /app
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=core.settings
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DB_HOST=db
    depends_on:
      - redis
      - db
      - web
    restart: always

volumes:
  postgres_data:
