<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verification Code</title>
</head>
<body style="margin: 0; padding: 24px 16px; background-color: #ffffff; color: #111111; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 15px; line-height: 1.6;">

    <div style="max-width: 540px; margin: 0 auto; background-color: #ffffff;">
        <h2 style="font-size: 20px; font-weight: 600; margin: 0 0 16px 0; color: #000000; border-bottom: 1px solid #e5e5e5; padding-bottom: 12px;">
            Email Verification
        </h2>

        <p style="margin: 0 0 20px 0;">
            Hi{% if name %} {{ name }}{% endif %},
        </p>

        <p style="margin: 0 0 20px 0;">
            Use the verification code below to complete your login or email verification:
        </p>

        <div style="margin: 24px 0; padding: 18px 24px; background-color: #f7f7f7; border: 1px solid #e5e5e5; border-radius: 6px; text-align: center;">
            <span style="font-family: 'Courier New', Courier, monospace; font-size: 32px; font-weight: 700; letter-spacing: 8px; color: #000000;">{{ otp }}</span>
        </div>

        <p style="margin: 0 0 20px 0; color: #555555; font-size: 14px;">
            This code will expire in <strong>5 minutes</strong>. If you did not request this code, you can safely ignore this email.
        </p>

        <p style="margin: 0; color: #666666; font-size: 13px; border-top: 1px solid #e5e5e5; padding-top: 14px;">
            Haven Wellness<br>
            support@havenwellness.com
        </p>
    </div>

</body>
</html>
